name: Editorial 2D campaign with voice
on:
  workflow_dispatch:
    inputs:
      width:
        description: Vertical video width
        type: choice
        options: ['540', '1080']
        default: '1080'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow edge-tts
      - name: Render narration and video
        env:
          VIDEO_WIDTH: ${{ inputs.width }}
        run: python motion2d/studio.py --project motion2d/campaign.json --output output/campaign.mp4 --width "$VIDEO_WIDTH"
      - uses: actions/upload-artifact@v4
        with:
          name: uniformer-editorial-2d
          path: |
            output/campaign.mp4
            output/campaign.json
          if-no-files-found: error
