name: UniFormer Studio — render and QA

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "Output width (540=fast, 1080=Full HD vertical)"
        required: true
        type: choice
        default: "1080"
        options:
          - "540"
          - "1080"
  push:
    paths:
      - "engine/**"
      - "projects/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Render animated short
        env:
          WIDTH: ${{ inputs.resolution || '1080' }}
        run: python -m engine.studio --project projects/first_light.json --width "$WIDTH" --output output/first_light.mp4
      - name: Check audio, resolution and black frames
        env:
          WIDTH: ${{ inputs.resolution || '1080' }}
        run: python -m engine.qa output/first_light.mp4 --min-width "$WIDTH"
      - name: Export publishing draft
        run: python -m engine.social --project projects/first_light.json --video output/first_light.mp4
      - name: Upload reviewed production package
        uses: actions/upload-artifact@v4
        with:
          name: uniformer-first-light-production
          path: output/
          if-no-files-found: error
          retention-days: 7
